---
- name: Ensure log directory exists (Windows)
  ansible.windows.win_file:
    path: "{{ execution_result_log_dir }}"
    state: directory

- name: Write execution result to log file (Windows)
  ansible.windows.win_lineinfile:
    path: "{{ execution_result_log_file }}"
    line: "{{ lookup('template', 'execution_result_entry.j2') | trim }}"
    create: true
