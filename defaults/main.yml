---
# Default input variables (expected to be overridden by the caller)
execution_result_return_code: 0
execution_result_stdout: ""
execution_result_stderr: ""
execution_result_message: ""
execution_result_exception: ""
execution_result_failed_task: ""
execution_result_failed_task_module: ""
execution_result_warnings: []

# AWX/Tower API configuration (automatically fetches metadata from AWX/Tower API)
# Auto-enable API mode when TOWER_JOB_ID environment variable is detected
execution_result_use_awx_api: "{{ lookup('env', 'TOWER_JOB_ID') | length > 0 }}"
# AWX/Tower API base URL (auto-detected from environment, override if needed)
execution_result_awx_api_url: "{{ lookup('env', 'AWX_HOST') | default(lookup('env', 'TOWER_HOST'), true) }}"
# OAuth Bearer token for AWX API authentication (must be provided via credential or extra vars)
execution_result_awx_token: "{{ lookup('env', 'AWX_OAUTH_TOKEN') | default(lookup('env', 'TOWER_OAUTH_TOKEN'), true) }}"
# Job ID to fetch details for (auto-detected from TOWER_JOB_ID, override if needed)
execution_result_awx_job_id: "{{ lookup('env', 'TOWER_JOB_ID') | default(lookup('env', 'AWX_JOB_ID'), true) }}"
# Validate SSL certificates when connecting to AWX API
execution_result_awx_validate_certs: true

# Logging configuration
execution_result_log_enabled: false
execution_result_log_file: >-
  {{ (ansible_os_family == 'Windows')
     | ternary('C:\\ProgramData\\Ansible\\ansible_execution_results.log',
               '/var/log/ansible_execution_results.log') }}
execution_result_log_dir: >-
  {{ (ansible_os_family == 'Windows')
     | ternary('C:\\ProgramData\\Ansible',
               '/var/log') }}

# Result aggregation
execution_result_accumulate: true
execution_result_results_fact: "execution_results"

# Timestamp format used in log entries
execution_result_timestamp_format: "%Y-%m-%d %H:%M:%S"

# Exit behaviour: when true, the role will fail the play if return_code != 0
execution_result_fail_on_error: false

# AWX/Tower artifact configuration (ansible.builtin.set_stats)
# When true, the role publishes execution results to the AWX/Tower job Artifacts section
execution_result_set_stats_enabled: true
# When true, results are stored per-host in addition to the aggregated artifact
execution_result_set_stats_per_host: false
